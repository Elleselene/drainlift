services:
  - type: web
    name: drainlift
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      # Supabase — ilalagay ang totoong values sa Render dashboard (Environment tab),
      # HUWAG dito sa file na ito. "sync: false" = hihingin ito ni Render sa dashboard,
      # hindi kailangang isulat dito ang lihim na values.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
